apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    testImplementation('org.nanohttpd:nanohttpd-websocket:2.3.1') {
        exclude module: 'nanohttpd' // FTC RobotCore already supplies NanoHTTPD.
    }
}

// Android AAR assets are not on a desktop unit-test classpath. Package AutoTune's
// published UI as test resources; the Android APK still uses the original AAR.
configurations { autoTuneAssets }
dependencies { autoTuneAssets 'com.pedropathing:tuning:1.0.2@aar' }
def desktopAssets = tasks.register('desktopAutoTuneAssets', Sync) {
    from { configurations.autoTuneAssets.collect { zipTree(it) } }
    include 'assets/pedro/**'
    into layout.buildDirectory.dir('generated/autotuneResources')
}
android.sourceSets.test.resources.srcDir(layout.buildDirectory.dir('generated/autotuneResources').get().asFile)
tasks.matching { it.name == 'processDebugUnitTestJavaRes' || it.name == 'processReleaseUnitTestJavaRes' }.configureEach {
    dependsOn desktopAssets
}
